<!doctype html>
<html>
  <head>
    <title><%= productName %></title>

    <meta charset="utf-8" />
    <meta name="description" content="<%= productDescription %>" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="msapplication-tap-highlight" content="no" />
    <meta
      name="viewport"
      content="user-scalable=no, initial-scale=1, maximum-scale=1, minimum-scale=1, width=device-width<% if (ctx.mode.cordova || ctx.mode.capacitor) { %>, viewport-fit=cover<% } %>"
    />

    <link rel="icon" type="image/png" href="favicon/favicon-96x96.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="favicon/favicon.svg" />
    <link rel="shortcut icon" href="favicon/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="favicon/apple-touch-icon.png" />
    <link rel="manifest" href="favicon/site.webmanifest" />

    <style>
      :root {
        --bg-1: #000000;
        --bg-2: #050505;
        --bg-3: #0a0a0a;
        --purple: #7c3aed;
        --santoro: #e97132;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        padding: 0;
        min-height: 100%;
        font-family: 'Roboto', sans-serif;
      }

      html {
        background:
          radial-gradient(circle at top left, rgba(233, 114, 50, 0.247), transparent 20%),
          radial-gradient(circle at bottom right, rgba(233, 113, 50, 0.06), transparent 18%),
          linear-gradient(135deg, #000000 0%, #030303 50%, #090909 100%);
        background-attachment: fixed;
      }

      body {
        position: relative;
        min-height: 100vh;
        color: #fff;
        background: transparent;
        overflow-x: hidden;
      }

      /* Grid sutil */
      body::before {
        content: '';
        position: fixed;
        inset: 0;
        pointer-events: none;
        z-index: 0;
        background-image:
          linear-gradient(rgba(255, 255, 255, 0.018) 1px, transparent 1px),
          linear-gradient(90deg, rgba(255, 255, 255, 0.018) 1px, transparent 1px);
        background-size: 38px 38px;
        mask-image: linear-gradient(to bottom, rgba(0, 0, 0, 0.78), transparent 95%);
        -webkit-mask-image: linear-gradient(to bottom, rgba(0, 0, 0, 0.78), transparent 95%);
      }

      /* Glow naranja Santoro + apoyo púrpura */
      body::after {
        content: '';
        position: fixed;
        inset: 0;
        pointer-events: none;
        z-index: 0;
        background:
          radial-gradient(circle at top left, rgba(233, 113, 50, 0.18), transparent 18%),
          radial-gradient(circle at bottom right, rgba(233, 113, 50, 0.12), transparent 20%),
          radial-gradient(circle at 85% 20%, rgba(124, 58, 237, 0.08), transparent 16%);
        filter: blur(20px);
      }

      /* Quasar app root */
      #q-app {
        position: relative;
        z-index: 1;
        min-height: 100vh;
        background: transparent !important;
      }

      .color-orange-santoro {
        color: var(--santoro);
      }
    </style>
  </head>
  <body>
    <!-- quasar:entry-point -->
  </body>
  <!--
  <script src="https://cdn.jsdelivr.net/npm/eruda"></script>
  <script>
    eruda.init()
  </script> -->
</html>
