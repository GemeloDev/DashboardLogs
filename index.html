<!doctype html>
<html>
  <head>
    <title><%= productName %></title>

    <meta charset="utf-8" />
    <meta name="description" content="<%= productDescription %>" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="msapplication-tap-highlight" content="no" />
    <meta
      name="viewport"
      content="user-scalable=no, initial-scale=1, maximum-scale=1, minimum-scale=1, width=device-width<% if (ctx.mode.cordova || ctx.mode.capacitor) { %>, viewport-fit=cover<% } %>"
    />

    <link rel="icon" type="image/png" sizes="128x128" href="icons/favicon-128x128.png" />
    <link rel="icon" type="image/png" sizes="96x96" href="icons/favicon-96x96.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="icons/favicon-16x16.png" />
    <link rel="icon" type="image/ico" href="favicon.ico" />

    <style>
      :root {
        --bg-1: #070b14;
        --bg-2: #0b1220;
        --bg-3: #111827;
        --cyan: #22d3ee;
        --purple: #7c3aed;
        --santoro: #e97132;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        padding: 0;
        min-height: 100%;
        font-family: 'Roboto', sans-serif;
      }

      html {
        background:
          radial-gradient(circle at top left, rgba(34, 211, 238, 0.08), transparent 24%),
          radial-gradient(circle at bottom right, rgba(124, 58, 237, 0.08), transparent 24%),
          linear-gradient(135deg, var(--bg-1) 0%, var(--bg-2) 45%, var(--bg-3) 100%);
        background-attachment: fixed;
      }

      body {
        position: relative;
        min-height: 100vh;
        color: #fff;
        background: transparent;
        overflow-x: hidden;
      }

      /* Grid sutil */
      body::before {
        content: '';
        position: fixed;
        inset: 0;
        pointer-events: none;
        z-index: 0;
        background-image:
          linear-gradient(rgba(255, 255, 255, 0.02) 1px, transparent 1px),
          linear-gradient(90deg, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
        background-size: 38px 38px;
        mask-image: linear-gradient(to bottom, rgba(0, 0, 0, 0.7), transparent 95%);
        -webkit-mask-image: linear-gradient(to bottom, rgba(0, 0, 0, 0.7), transparent 95%);
      }

      /* Glow cyan */
      body::after {
        content: '';
        position: fixed;
        inset: 0;
        pointer-events: none;
        z-index: 0;
        background:
          radial-gradient(circle at top left, rgba(34, 211, 238, 0.16), transparent 18%),
          radial-gradient(circle at bottom right, rgba(124, 58, 237, 0.16), transparent 20%);
        filter: blur(18px);
      }

      /* Quasar app root */
      #q-app {
        position: relative;
        z-index: 1;
        min-height: 100vh;
        background: transparent !important;
      }

      .color-orange-santoro {
        color: var(--santoro);
      }
    </style>
  </head>
  <body>
    <!-- quasar:entry-point -->
  </body>
  <!--
  <script src="https://cdn.jsdelivr.net/npm/eruda"></script>
  <script>
    eruda.init()
  </script> -->
</html>
