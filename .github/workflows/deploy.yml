name: Deploy to Santoro FTP

# El evento que dispara la acción: cada vez que hagas push a la rama 'development'
on:
  push:
    branches:
      - development # Se dispara cuando haces push a la rama development

jobs:
  deploy-job:
    name: Subida de archivos por FTP
    runs-on: ubuntu-latest # Usamos la máquina Linux más eficiente y gratuita

    steps:
      # 1. Obtener el código del repositorio
      - name: Checkout de código
        uses: actions/checkout@v4

      # 2. Configurar Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18' # Node.js 18 LTS
          cache: 'npm'

      # 3. Instalar dependencias
      - name: Instalar dependencias
        run: npm ci

      # 4. Crear el build de producción con Quasar
      - name: Build de producción
        run: npm run build
        env:
          NODE_ENV: production

      # 5. Eliminar xd.txt del servidor si existe
      - name: Eliminar xd.txt remoto
        run: |
          curl -v --ftp-ssl -k -u "${{ secrets.FTP_USERNAME }}:${{ secrets.FTP_PASSWORD }}" "ftp://${{ secrets.FTP_SERVER }}/xd.txt" -Q "DELE xd.txt" || echo "xd.txt no existe o ya fue eliminado"
        continue-on-error: true

      # 6. Desplegar archivos del build vía FTP
      - name: FTP Deploy
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: 21
          # Carpeta local a subir (donde Quasar genera el build en modo SPA)
          local-dir: ./dist/spa/
          # Carpeta de destino en el servidor FTP
          server-dir: /
          # Excluir archivos que NO queremos sobrescribir
          exclude: |
            **/.htaccess
            **/web.config
            **/.ftpquota
