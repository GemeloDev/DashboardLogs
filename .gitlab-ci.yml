# ═══════════════════════════════════════════════════════════════
# GitLab CI/CD Pipeline - Frontend Quasar a S3 + CloudFront
# ═══════════════════════════════════════════════════════════════
#
# Pipeline para build y deploy del frontend Quasar a AWS S3
# con invalidación de caché en CloudFront
#
# Fases:
#   1. build   - Instala dependencias y genera build de producción
#   2. deploy  - Sube archivos a S3 y invalida caché de CloudFront
#
# Variables requeridas (Settings > CI/CD > Variables):
#   - AWS_ACCESS_KEY_ID      : Credencial de AWS
#   - AWS_SECRET_ACCESS_KEY  : Credencial secreta de AWS
#   - AWS_DEFAULT_REGION     : Región de AWS (us-east-1)
#   - S3_FRONTEND_BUCKET     : Bucket S3 del frontend
#   - CLOUDFRONT_DISTRIBUTION_ID : ID de distribución CloudFront
#
# ═══════════════════════════════════════════════════════════════

stages:
  - build
  - deploy

# Variables globales
variables:
  NODE_ENV: "production"

# Cache para node_modules
cache:
  key:
    files:
      - package-lock.json
  paths:
    - node_modules/

# ───────────────────────────────────────────────────────────────
# STAGE 1: BUILD
# ───────────────────────────────────────────────────────────────
build:
  stage: build
  image: node:18

  # Ejecutar en las ramas indicadas
  only:

    - development

  before_script:
    - echo "📦 Checkout de código"
    - node --version
    - npm --version

  script:
    - echo "🔧 Instalar dependencias"
    - npm ci

    - echo "🏗️ Build de producción"
    - npm run build

    - echo "✅ Build completado exitosamente"
    - ls -la dist/spa/

  artifacts:
    name: "dashboard-logs-$CI_COMMIT_SHORT_SHA"
    paths:
      - dist/spa/
    expire_in: 1 hour

# ───────────────────────────────────────────────────────────────
# STAGE 2: DEPLOY a S3 + CloudFront
# ───────────────────────────────────────────────────────────────
deploy:
  stage: deploy
  image: amazon/aws-cli:latest

  # Ejecutar en las ramas indicadas
  only:

    - development

  dependencies:
    - build

  before_script:
    - echo "📡 Preparando despliegue a S3"
    - echo "📍 Bucket: $S3_FRONTEND_BUCKET"
    - echo "🌐 CloudFront ID: $CLOUDFRONT_DISTRIBUTION_ID"

  script:
    # Subir archivos a S3
    - echo "🚀 Subiendo archivos a S3..."
    - aws s3 sync dist/spa/ "s3://$S3_FRONTEND_BUCKET/" --delete --region $AWS_DEFAULT_REGION

    - echo "✅ Archivos subidos exitosamente"

    # Invalidar caché de CloudFront para que los cambios se vean inmediatamente
    - echo "🔄 Invalidando caché de CloudFront..."
    - |
      aws cloudfront create-invalidation \
        --distribution-id "$CLOUDFRONT_DISTRIBUTION_ID" \
        --paths "/*" \
        --region us-east-1

    - echo "✅ Caché invalidado - cambios visibles en ~1-2 minutos"

  environment:
    name: production
    url: https://dashboard.grupo-santoro.com.mx

  allow_failure: false

# ───────────────────────────────────────────────────────────────
# STAGE OPCIONAL: Deploy manual (para hotfixes)
# ───────────────────────────────────────────────────────────────
deploy_manual:
  stage: deploy
  image: amazon/aws-cli:latest

  when: manual

  dependencies: []

  script:
    - echo "🔧 Deploy manual触发"
    - aws s3 sync dist/ "s3://$S3_FRONTEND_BUCKET/" --delete --region $AWS_DEFAULT_REGION
    - aws cloudfront create-invalidation --distribution-id "$CLOUDFRONT_DISTRIBUTION_ID" --paths "/*" --region us-east-1

  environment:
    name: production
