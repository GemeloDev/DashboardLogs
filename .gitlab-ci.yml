# ═══════════════════════════════════════════════════════════════
# GitLab CI/CD Pipeline - Frontend Quasar a S3 + CloudFront
# ═══════════════════════════════════════════════════════════════

stages:
  - build
  - deploy

# NO definir NODE_ENV aquí - lo configuramos por comando
# variables:
#   NODE_ENV: "production"

# Cache desactivado temporalmente para forzar instalación limpia
# cache:
#   key:
#     files:
#       - package-lock.json
#   paths:
#     - node_modules/

build:
  stage: build
  image: node:20
  only:
    - development

  before_script:
    - echo "Checkout de codigo"
    - node --version
    - npm --version

  script:
    - echo "Instalando dependencias (incluyendo dev)"
    - npm install
    - echo "Verificando @quasar/app-vite"
    - npm list @quasar/app-vite
    - echo "Build de produccion"
    - NODE_ENV=production npm run build
    - echo "Build completado exitosamente"
    - ls -la dist/spa/

  artifacts:
    name: "dashboard-logs-$CI_COMMIT_SHORT_SHA"
    paths:
      - dist/spa/
    expire_in: 1 hour

deploy:
  stage: deploy
  image: amazon/aws-cli:latest
  only:
    - development
  dependencies:
    - build

  before_script:
    - echo "Preparando despliegue a S3"

  script:
    - echo "Subiendo archivos a S3"
    - aws s3 sync dist/spa/ "s3://$S3_FRONTEND_BUCKET/" --delete --region $AWS_DEFAULT_REGION
    - echo "Archivos subidos exitosamente"
    - echo "Invalidando cache de CloudFront"
    - aws cloudfront create-invalidation --distribution-id "$CLOUDFRONT_DISTRIBUTION_ID" --paths "/*" --region us-east-1
    - echo "Cache invalidado - cambios visibles en ~1-2 minutos"

  environment:
    name: production
    url: https://dashboard.grupo-santoro.com.mx

  allow_failure: false
