# ═══════════════════════════════════════════════════════════════
# GitLab CI/CD Pipeline - Frontend Quasar a S3 + CloudFront
# ═══════════════════════════════════════════════════════════════

stages:
  - build
  - deploy

build:
  stage: build
  image: node:20
  only:
    - development

  before_script:
    - echo "Checkout de codigo"
    - node --version
    - npm --version

  script:
    - echo "Instalando dependencias"
    - npm install
    - echo "Build de produccion"
    - NODE_ENV=production npm run build
    - echo "Build completado exitosamente"
    - ls -la dist/spa/

  artifacts:
    name: "dashboard-logs-$CI_COMMIT_SHORT_SHA"
    paths:
      - dist/spa/
    expire_in: 1 hour

deploy:
  stage: deploy
  image: amazon/aws-cli:2.15.0
  only:
    - development
  dependencies:
    - build

  script:
    - echo "Subiendo archivos a S3"
    - aws s3 sync dist/spa/ s3://$S3_FRONTEND_BUCKET/ --delete --region $AWS_DEFAULT_REGION
    - echo "Archivos subidos exitosamente"
    - echo "Invalidando cache de CloudFront"
    - aws cloudfront create-invalidation --distribution-id $CLOUDFRONT_DISTRIBUTION_ID --paths "/*"
    - echo "Cache invalidado - cambios visibles en ~1-2 minutos"

  environment:
    name: production
    url: https://dashboard.grupo-santoro.com.mx

  allow_failure: false
